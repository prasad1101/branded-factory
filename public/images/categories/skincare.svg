        <rect x="-40" y="-150" width="80" height="40" rx="6" fill="url(#gold)"/>
        <rect x="-95" y="-115" width="190" height="320" rx="34" fill="url(#body)"/><rect x="-75" y="-95" width="14" height="260" rx="7" fill="#fff" opacity=".28"/>
    <rect x="-75" y="-10" width="150" height="130" rx="10" fill="#FFFDF8" opacity=".95"/>
    <text x="0" y="59" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="url(#ink)">S</text>
    <text x="0" y="85" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="1.5" fill="url(#ink)" opacity=".75">SKINCARE</text>

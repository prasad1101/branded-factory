        <rect x="-150" y="-55" width="300" height="230" rx="34" fill="url(#body)"/><rect x="-125" y="-35" width="14" height="180" rx="7" fill="#fff" opacity=".28"/>
    <rect x="-105" y="-15" width="210" height="130" rx="10" fill="#FFFDF8" opacity=".95"/>
    <text x="0" y="54" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="url(#ink)">S</text>
    <text x="0" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="url(#ink)" opacity=".75">SNACKS</text>

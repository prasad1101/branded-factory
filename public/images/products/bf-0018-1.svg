      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#F6F0E3"/>
      <stop offset="1" stop-color="#E8DABA" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D4AE5C"/><stop offset="1" stop-color="#A9843A"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8CF8D"/><stop offset="1" stop-color="#A9843A"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5E4517"/><stop offset="1" stop-color="#5E4517"/></linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>

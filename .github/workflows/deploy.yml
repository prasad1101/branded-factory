# Validates the product data, builds the site and publishes it to GitHub Pages
# every time something is pushed (or edited on github.com) on the main branch.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run a deploy manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push waits for the current one to finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate & build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # If this step fails, open it to see exactly which product/field needs fixing.
      # The live site keeps the previous version until the data is fixed.
      - name: Validate store data (products, categories, site settings)
        run: npm run validate-data

      - name: Build the website
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

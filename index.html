<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Branded Factory | Bumper Discounts on Top Brands</title>
    <meta name="description" content="Branded Factory is your premium online supermart. Bumper discounts, assured savings and the greatest deals on genuine branded skincare, grocery, household and more. Order instantly on WhatsApp." />
    <meta name="theme-color" content="#0F1B2D" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Branded Factory" />
    <meta property="og:title" content="Branded Factory | Bumper Discounts on Top Brands" />
    <meta property="og:description" content="Bumper Discounts. Assured Savings. Greatest Deals. Order genuine branded products on WhatsApp." />
    <meta property="og:url" content="https://prasad1101.github.io/branded-factory/" />
    <meta property="og:image" content="https://prasad1101.github.io/branded-factory/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" /></noscript>
    <script>
      ;(function () {
        // Start downloading the catalog JSON while the app's JavaScript loads (used by src/lib/data.js)
        window.__BF_PRELOAD__ = ['site', 'categories', 'products'].reduce(function (o, f) {
          o[f] = fetch('%BASE_URL%data/' + f + '.json', { cache: 'no-cache' })
          return o
        }, {})

        function addLink(rel, href, as) {
          var l = document.createElement('link')
          l.rel = rel
          l.href = href
          if (as) l.as = as
          document.head.appendChild(l)
          return l
        }

        // Start downloading this page's JavaScript right away (map filled in at build time by scripts/vite-route-preload.js)
        var route = (location.hash.replace(/^#\/?/, '').split(/[/?]/)[0] || '').toLowerCase()
        var chunks = /*ROUTE_CHUNKS*/ null
        if (chunks && chunks[route]) {
          chunks[route].forEach(function (f) {
            addLink('modulepreload', '%BASE_URL%' + f)
          })
        }

        function preloadImage(img) {
          if (!img || /^(https?:)?\/\//.test(img)) return
          addLink('preload', '%BASE_URL%' + img.replace(/^\.?\//, ''), 'image').setAttribute('fetchpriority', 'high')
        }

        // On a product page, preload that product's main photo as soon as products.json arrives
        if (route === 'product') {
          var id = decodeURIComponent(location.hash.split(/[/?]/)[2] || '')
          window.__BF_PRELOAD__.products
            .then(function (r) {
              return r.clone().json()
            })
            .then(function (list) {
              for (var i = 0; i < list.length; i++) if (list[i].id === id) return preloadImage(list[i].images && list[i].images[0])
            })
            .catch(function () {})
        }

        // On the home page, preload the first hero banner as soon as site.json arrives
        if (!route) {
          window.__BF_PRELOAD__.site
            .then(function (r) {
              return r.clone().json()
            })
            .then(function (s) {
              preloadImage(s.heroBanners && s.heroBanners[0] && s.heroBanners[0].image)
            })
            .catch(function () {})
        }
      })()
    </script>
  </head>
  <body class="bg-cream text-ink antialiased">
    <div id="root"></div>
    <noscript>Please enable JavaScript to browse Branded Factory.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
